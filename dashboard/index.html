<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break the Model — Progress</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121724; --panel2:#0f1420; --line:#20283a;
    --ink:#e6ebf5; --muted:#9aa5bb; --dim:#8591a8;
    --red:#ff5d6c; --amber:#ffb454; --green:#4ade80; --blue:#5aa9ff; --violet:#b98cff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 500px at 15% -10%,rgba(90,169,255,.08),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(185,140,255,.07),transparent 55%)}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:40px 16px 80px}
  header{margin-bottom:28px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--blue);display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
  h1{font-size:34px;margin:10px 0 6px;letter-spacing:-.02em;font-weight:700}
  .sub{color:var(--muted);max-width:72ch;font-size:14.5px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--dim);
    font-family:var(--mono)}
  .meta-row b{color:var(--muted);font-weight:500}
  .meta-row .dot{margin-right:6px}
  .headline{margin:22px 0 30px;padding:16px 18px;border:1px solid var(--line);
    border-radius:10px;background:linear-gradient(180deg,var(--panel),var(--panel2));font-size:15px}
  h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    font-family:var(--mono);margin:34px 0 14px;font-weight:600}
  .grid{display:grid;gap:12px}
  .lv{grid-template-columns:repeat(3,1fr)}
  @media(max-width:720px){.lv{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:12px;padding:16px}
  .lvl .id{font-family:var(--mono);font-size:22px;font-weight:700}
  .lvl .nm{color:var(--muted);font-size:13px;margin:6px 0 12px;min-height:34px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;font-weight:600}
  .s-cleared{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.3)}
  .s-holds{background:rgba(255,180,84,.12);color:var(--amber);border:1px solid rgba(255,180,84,.3)}
  .s-disputed,.s-open{background:rgba(255,93,108,.1);color:var(--red);border:1px solid rgba(255,93,108,.28)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  td.model{font-weight:600}
  .tag{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:6px;text-transform:uppercase}
  .rate{font-family:var(--mono);font-weight:600}
  .r100{color:var(--green)} .rmid{color:var(--amber)} .rlow{color:var(--red)} .rres{color:var(--dim)}
  .vd{color:var(--muted);font-size:12.5px}
  .atk .ah{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .atk .aid{font-family:var(--mono);color:var(--blue);font-weight:700;font-size:13px}
  .atk .anm{font-weight:600}
  .atk.retracted{opacity:.6}
  .atk.retracted .aid{color:var(--red)}
  .atk.retracted .res{color:var(--red)}
  .atk .idea{color:var(--dim);font-size:13px;margin:8px 0 6px}
  .atk .res{font-size:13.5px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.two{grid-template-columns:1fr}}
  .lead{font-weight:600;color:var(--muted);font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
  ul.clean{margin:8px 0 0;padding-left:18px}
  ul.clean li{margin:7px 0;font-size:13.5px}
  .next li{color:var(--ink)}
  .code{font-family:var(--mono);font-size:12.5px;color:var(--violet)}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);
    font-size:12px;font-family:var(--mono);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Break the Model</h1>
    <p class="sub" id="subtitle"></p>
    <div class="meta-row">
      <span><span class="dot"></span> live tracker</span>
      <span><b>Target:</b> <span id="target"></span></span>
      <span><b>Updated:</b> <span id="updated"></span></span>
    </div>
  </header>

  <div class="headline" id="headline"></div>

  <h2>Levels</h2>
  <div class="grid lv" id="levels"></div>

  <h2>Models × Attacks</h2>
  <div class="card" style="padding:4px 6px"><table><thead><tr>
    <th>Model</th><th>A1 encoding</th><th>A2 pretext</th><th>A3 injection</th><th>Verdict</th>
  </tr></thead><tbody id="models"></tbody></table></div>

  <h2>Attacks</h2>
  <div class="grid" id="attacks"></div>

  <h2>Data &amp; SSN</h2>
  <div class="two">
    <div class="card">
      <div class="lead" style="color:var(--green)">Leaked (fake data)</div>
      <p style="font-size:13.5px;margin:8px 0" id="leak-got"></p>
      <div class="lead" style="color:var(--dim);margin-top:12px">Never obtained</div>
      <p style="font-size:13.5px;margin:8px 0 0;color:var(--muted)" id="leak-no"></p>
    </div>
    <div class="card">
      <div class="lead">SSN</div>
      <div style="margin:10px 0"><span class="pill s-disputed" id="ssn-status"></span></div>
      <p style="font-size:13.5px;margin:0;color:var(--muted)" id="ssn-detail"></p>
    </div>
  </div>

  <h2>Defense</h2>
  <div class="card">
    <div class="ah" style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <span class="code" id="def-file"></span>
      <span class="pill s-cleared" id="def-status"></span>
    </div>
    <ul class="clean" id="def-layers"></ul>
    <p style="font-size:13px;color:var(--amber);margin:12px 0 0"><b>Gap:</b> <span id="def-gap"></span></p>
  </div>

  <h2>Next</h2>
  <div class="card"><ul class="clean next" id="next"></ul></div>

  <footer>
    <span id="foot-updated"></span>
    <span>Edit <span class="code">status.json</span> to update this board.</span>
  </footer>
</div>

<script>
const rateClass=(v)=>{const s=(v||"").toLowerCase();
  if(s.includes("100"))return"r100";
  if(s.includes("resist"))return"rres";
  const n=parseInt(s);if(isNaN(n))return"rmid";
  return n>=90?"r100":n>=40?"rmid":"rlow";};
const statusPill=(s)=>({cleared:"s-cleared",holds:"s-holds",disputed:"s-disputed",open:"s-open"}[s]||"s-holds");
const esc=(x)=>String(x==null?"":x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(d){
  const m=d.meta||{};
  document.getElementById("title").textContent=m.project||"Break the Model";
  document.getElementById("subtitle").textContent=m.subtitle||"";
  document.getElementById("target").textContent=m.target||"";
  const up=m.updated?new Date(m.updated).toLocaleString():"—";
  document.getElementById("updated").textContent=up;
  document.getElementById("foot-updated").textContent="Last updated: "+up;
  document.getElementById("headline").textContent=d.headline||"";

  document.getElementById("levels").innerHTML=(d.levels||[]).map(l=>`
    <div class="card lvl">
      <div class="id">${esc(l.id)}</div>
      <div class="nm">${esc(l.name)}</div>
      <span class="pill ${statusPill(l.status)}">${esc(l.status)}</span>
    </div>`).join("");

  document.getElementById("models").innerHTML=(d.models||[]).map(x=>`
    <tr>
      <td class="model">${esc(x.name)}${x.tag?`<span class="tag">${esc(x.tag)}</span>`:""}</td>
      <td class="rate ${rateClass(x.a1)}">${esc(x.a1)}</td>
      <td class="rate ${rateClass(x.a2)}">${esc(x.a2)}</td>
      <td class="rate ${rateClass(x.a3)}">${esc(x.a3)}</td>
      <td class="vd">${esc(x.verdict)}</td>
    </tr>`).join("");

  document.getElementById("attacks").innerHTML=(d.attacks||[]).map(a=>{
    const ret=/retract/i.test(a.result);
    return `<div class="card atk${ret?" retracted":""}">
      <div class="ah"><span class="aid">${esc(a.id)}</span><span class="anm">${esc(a.name)}</span></div>
      <div class="idea">${esc(a.idea)}</div>
      <div class="res">${esc(a.result)}</div>
    </div>`;}).join("");

  const lk=d.leaks||{};
  document.getElementById("leak-got").textContent=lk.obtained||"";
  document.getElementById("leak-no").textContent=lk.not_obtained||"";
  const ssn=d.ssn||{};
  document.getElementById("ssn-status").textContent=ssn.status||"";
  document.getElementById("ssn-detail").textContent=ssn.detail||"";

  const df=d.defense||{};
  document.getElementById("def-file").textContent=df.file||"defense.py";
  document.getElementById("def-status").textContent=df.status||"";
  document.getElementById("def-layers").innerHTML=(df.layers||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("def-gap").textContent=df.gap||"";

  document.getElementById("next").innerHTML=(d.next||[]).map(x=>`<li>${esc(x)}</li>`).join("");
}

(async()=>{
  let data;
  try{data=JSON.parse(document.getElementById("embedded").textContent);}catch(e){data={};}
  render(data); // embedded first so it never renders blank
  try{
    const r=await fetch("status.json?_="+Date.now(),{cache:"no-store"});
    if(r.ok) render(await r.json()); // live override on Pages
  }catch(e){/* file:// — keep embedded */}
})();
</script>
</body>
</html>
